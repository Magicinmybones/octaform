<style>
/* ---------- Embedded fonts (TeX Gyre Adventor = ITC Avant Garde metric clone, TeX Gyre Heros = Helvetica clone) ---------- */
@font-face{font-family:"OF Display";src:url(assets/of-display-regular.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"OF Display";src:url(assets/of-display-bold.woff2) format("woff2");font-weight:700;font-display:block}

/* ---------- Tokens (all measured from the 1280×800 reference) ---------- */
:root{
  --navy:#1a3058;          /* all dark text */
  --blue:#1749a8;          /* primary buttons */
  --card:rgba(22,71,164,.97);
  --glass:rgba(255,255,255,.75);
  --glass-weak:rgba(255,255,255,.40);
  --chip:#3e72dc;
  --ink:#04070e;
  /* 1 design pixel. The 1280×800 artboard scales uniformly to whichever axis is tighter,
     while every block stays pinned to its own screen edge — so there are never empty bands. */
  --u:min(calc(100vw / 1280), calc(100vh / 800));
  --vh:100vh;
}
@supports (height:100dvh){:root{--u:min(calc(100vw / 1280), calc(100dvh / 800));--vh:100dvh}}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1f74d4;overflow:hidden}
body{font-family:"OF Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
a,button{color:inherit;font:inherit;text-decoration:none;background:none;border:0;cursor:pointer}
:focus-visible{outline:calc(2 * var(--u)) solid #fff;outline-offset:calc(2 * var(--u))}

/* ---------- Stage ---------- */
.stage{position:relative;width:100vw;height:var(--vh);overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-1;background:#2a6fd0 url(assets/hero-background.jpg) 60% 50%/cover no-repeat}
/* the artboard image is exactly 16:10 so at 1280×800 (and any 16:10 screen) it maps 1:1 */

/* ---------- Entrance (runs once; html.intro is removed when it ends) ---------- */
.copy h1 .ln,.copy h1 .ln>span{display:block}
.intro [data-intro]{opacity:0}
.intro .copy h1 .ln{overflow:hidden;overflow-x:visible;overflow-y:clip}
.intro .copy h1 .ln>span{transform:translateY(105%)}

/* ---------- Header ---------- */
.logo{position:absolute;left:calc(16 * var(--u));top:calc(14 * var(--u));display:flex;align-items:flex-start;height:calc(48 * var(--u))}
.logo svg{width:calc(40 * var(--u));height:calc(48 * var(--u));display:block}
.logo span{font-family:"OF Display";font-weight:700;font-size:calc(31.4 * var(--u));line-height:1;letter-spacing:calc(.5 * var(--u));
  position:absolute;left:calc(43 * var(--u));top:calc(6.6 * var(--u));white-space:nowrap}

.menu{position:absolute;top:calc(16 * var(--u));left:calc(50% - 216 * var(--u));width:calc(426 * var(--u));height:calc(50 * var(--u));
  border-radius:calc(16 * var(--u));background:var(--glass);-webkit-backdrop-filter:blur(calc(12 * var(--u)));backdrop-filter:blur(calc(12 * var(--u)))}

.menu .chev{width:calc(9 * var(--u));height:calc(5 * var(--u));position:absolute;top:calc(23 * var(--u))}

.btn{position:absolute;display:flex;align-items:center;justify-content:center;height:calc(50.5 * var(--u));border-radius:calc(16 * var(--u));
  font-size:calc(17.4 * var(--u));padding-top:calc(2 * var(--u));white-space:nowrap}
.btn--glass{background:var(--glass-weak);border:calc(1 * var(--u)) solid rgba(26,48,88,.78);
  -webkit-backdrop-filter:blur(calc(10 * var(--u)));backdrop-filter:blur(calc(10 * var(--u)))}
.btn--solid{background:var(--blue);color:#fff}
.btn--light{background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 calc(1 * var(--u)) rgba(26,48,88,.75);
  -webkit-backdrop-filter:blur(calc(10 * var(--u)));backdrop-filter:blur(calc(10 * var(--u)))}
.btn:hover{filter:brightness(1.06)}

.begin{position:absolute;top:calc(16 * var(--u));height:calc(50.5 * var(--u));right:calc((var(--edge) + var(--build-w) + var(--gap-btn) + var(--demo-w) + var(--gap-link)) * var(--u));display:flex;align-items:center;padding-top:calc(2 * var(--u));font-size:calc(17.4 * var(--u));letter-spacing:calc(.1 * var(--u))}

.masthead{--edge:30;--build-w:120;--demo-w:119;--gap-btn:12;--gap-link:24}
.top-build{right:calc(var(--edge) * var(--u));top:calc(16 * var(--u));width:calc(var(--build-w) * var(--u))}
.burger{display:none}
.nav-panel,.actions{display:contents}

/* ---------- Hero copy (pinned bottom-left) ---------- */

.copy h1{font-family:"OF Display";font-weight:400;font-size:calc(60 * var(--u));line-height:calc(65 * var(--u));letter-spacing:calc(.72 * var(--u));
  position:relative;left:calc(-2.2 * var(--u));white-space:nowrap}

.copy .btn{top:0}
.hero-demo{left:calc(-1.75 * var(--u));width:calc(119.5 * var(--u));height:calc(50.5 * var(--u))}
.hero-build{left:calc(125 * var(--u));width:calc(121 * var(--u));height:calc(50 * var(--u))}

/* ---------- Explore card + chat (pinned bottom-right) ---------- */

  border-radius:calc(16 * var(--u));background:var(--card);color:#fff;padding:calc(15.4 * var(--u)) 0 0 calc(15.6 * var(--u));

  border-radius:calc(23.25 * var(--u));background:linear-gradient(90deg,#0c0c12,#04070e 70%);color:#fff;font-size:calc(12.7 * var(--u));letter-spacing:calc(.1 * var(--u))}

@media (min-width:600px) and (max-width:1099.98px) and (min-height:500px), (orientation:landscape) and (max-width:1099.98px) and (max-height:499.98px), (orientation:landscape) and (max-width:599.98px), (max-width:599.98px) and (orientation:portrait){

    width:calc(300 * var(--u));padding:calc(8 * var(--u));border-radius:calc(16 * var(--u));
    background:var(--glass);-webkit-backdrop-filter:blur(calc(12 * var(--u)));backdrop-filter:blur(calc(12 * var(--u)));

  .menu{position:static;width:auto;height:auto;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0;display:flex;flex-direction:column}
  .menu a,.nav-panel .begin{position:static;height:auto;min-height:max(calc(46 * var(--u)), 44px);padding:calc(2 * var(--u)) calc(14 * var(--u)) 0;
    display:flex;align-items:center;gap:calc(8 * var(--u));border-radius:calc(10 * var(--u));font-size:max(calc(17.4 * var(--u)), 16px);letter-spacing:calc(.1 * var(--u))}
  .menu a{left:auto!important}
  .menu .chev{display:none}
  .menu .chev-after::after,.menu .chev-before::before{content:"";flex:none;width:calc(9 * var(--u));height:calc(5 * var(--u));margin-top:calc(-2 * var(--u));

  .menu a:hover,.nav-panel .begin:hover{background:rgba(255,255,255,.55)}

/* ==========================================================================

   the uniform scale would push labels under 15px, so the scale gets a floor and the

  .bg{background-position:62% 50%}

  .explore{bottom:calc(40 * var(--u) + env(safe-area-inset-bottom))}
  .arrow{bottom:calc(53 * var(--u) + env(safe-area-inset-bottom))}

/* ==========================================================================

   Plenty of width, very little height: keep the desktop/tablet composition (copy bottom-left,
   card + arrow + chat bottom-right) with a touch-size floor, clear the side notches, and lay
   the dropdown out in two columns so it never runs past the bottom of the screen.
   ========================================================================== */

  :root{--u:min(1px, max(.72px, min(calc(100vw / 780), calc(100vh / 520))))}
  @supports (height:100dvh){:root{--u:min(1px, max(.72px, min(calc(100vw / 780), calc(100dvh / 520))))}}

  .logo{left:calc(16 * var(--u) + env(safe-area-inset-left))}
  .burger{right:calc(30 * var(--u) + env(safe-area-inset-right));width:max(calc(50.5 * var(--u)), 40px);height:max(calc(50.5 * var(--u)), 40px)}

    display:grid;grid-template-columns:1fr 1fr;column-gap:calc(8 * var(--u));align-items:center}
  .menu{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;column-gap:calc(8 * var(--u))}
  .nav-panel .begin{margin-top:calc(4 * var(--u))}
  .copy{left:max(calc(24px + env(safe-area-inset-left)), min(calc(72 * var(--u)), 6vw));bottom:calc(39.5 * var(--u) + env(safe-area-inset-bottom))}
  .explore{right:calc(46 * var(--u) + env(safe-area-inset-right));bottom:calc(40 * var(--u) + env(safe-area-inset-bottom))}
  .arrow{right:calc(70.5 * var(--u) + env(safe-area-inset-right));bottom:calc(53 * var(--u) + env(safe-area-inset-bottom))}
  .chat{right:calc(16.5 * var(--u) + env(safe-area-inset-right));bottom:calc(11.5 * var(--u) + env(safe-area-inset-bottom));font-size:max(calc(12.7 * var(--u)), 12px)}
}

/* ==========================================================================
   MOBILE — PORTRAIT PHONES (under 600px wide). The tablet bottom row (copy beside the card)
   stops fitting below 600px, so the card + arrow lift to the top-right under the header,
   the copy keeps the bottom-left and the chat keeps the bottom-right corner.
   Header becomes logo + menu; both header CTAs move into the dropdown as a button pair.
   ========================================================================== */
@media (max-width:599.98px) and (orientation:portrait){
  :root{--u:max(.82px, min(calc(100vw / 390), calc(100vh / 760)))}
  @supports (height:100dvh){:root{--u:max(.82px, min(calc(100vw / 390), calc(100dvh / 760)))}}

  .logo{left:calc(14 * var(--u));top:calc(max(14 * var(--u), env(safe-area-inset-top)))}
  .burger{top:calc(max(14 * var(--u), env(safe-area-inset-top)) + 3 * var(--u));right:calc(14 * var(--u));
    width:max(calc(46 * var(--u)), 44px);height:max(calc(46 * var(--u)), 44px);border-radius:calc(14 * var(--u))}

  /* dropdown: the whole actions group becomes one glass surface */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:calc(8 * var(--u));position:absolute;z-index:5;
    left:calc(14 * var(--u));right:calc(14 * var(--u));top:calc(max(14 * var(--u), env(safe-area-inset-top)) + 57 * var(--u));
    padding:calc(8 * var(--u));border-radius:calc(16 * var(--u));
    background:var(--glass);-webkit-backdrop-filter:blur(calc(12 * var(--u)));backdrop-filter:blur(calc(12 * var(--u)));

  .masthead[data-menu="open"] .actions{opacity:1;visibility:visible;transform:none;transition:opacity .18s ease,transform .18s ease}
  .nav-panel,.masthead[data-menu="open"] .nav-panel{display:contents;opacity:1;visibility:inherit;transform:none;transition:none}

<body>
<main class="stage">
  <div class="bg" role="img" aria-label="An iridescent pearl octopus floating above a blue salt-flat lagoon beside a glass sphere"></div>

<header class="masthead">
  <a class="logo" data-intro href="#" aria-label="octaform home">
    <svg viewBox="16 14 40 48" aria-hidden="true">
      <defs>
        <radialGradient id="ofSphere" cx="30%" cy="42%" r="78%">
          <stop offset="0" stop-color="#557ddf"/><stop offset=".42" stop-color="#3d62c2"/>
          <stop offset=".78" stop-color="#25408b"/><stop offset="1" stop-color="#1c336e"/>
        </radialGradient>
      </defs>
      <circle cx="25.4" cy="20" r="6.7" fill="#3a64cc"/>
      <circle cx="35.1" cy="42" r="17.4" fill="url(#ofSphere)"/>
      <ellipse cx="28.7" cy="25" rx="5.9" ry="5" fill="#fff"/>
    </svg>
    <span>octaform</span>
  </a>

  <button class="burger" data-intro type="button" aria-controls="site-menu" aria-expanded="false" aria-label="Open menu">
    <svg viewBox="0 0 20 14" aria-hidden="true"><path d="M1 1h18M1 7h18M1 13h18" stroke="#1a3058" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="actions" id="site-menu">
    <div class="nav-panel">
      <nav class="menu" data-intro aria-label="Primary">
        <a href="#" class="chev-after" style="left:calc(16.7 * var(--u))">Preview</a>
        <svg class="chev" style="left:calc(85 * var(--u))" viewBox="0 0 9 5" aria-hidden="true"><path d="M.8.8 4.5 4.2 8.2.8" fill="none" stroke="#1a3058" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <a href="#" class="chev-after" style="left:calc(112.8 * var(--u))">Showcase</a>
        <svg class="chev" style="left:calc(204 * var(--u))" viewBox="0 0 9 5" aria-hidden="true"><path d="M.8.8 4.5 4.2 8.2.8" fill="none" stroke="#1a3058" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <a href="#" style="left:calc(233 * var(--u))">Tutorials</a>
        <svg class="chev" style="left:calc(325.5 * var(--u))" viewBox="0 0 9 5" aria-hidden="true"><path d="M.8.8 4.5 4.2 8.2.8" fill="none" stroke="#1a3058" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <a href="#" class="chev-before" style="left:calc(344.8 * var(--u))">Compare</a>
      </nav>
      <a class="begin" data-intro href="#">Begin</a>
      <a class="btn btn--glass top-demo" data-intro href="#">Book a Demo</a>
    </div>
    <a class="btn btn--solid top-build" data-intro href="#">Build Today</a>
  </div>
</header>

  <section class="copy">
    <h1><span class="ln"><span>3D Canvases</span></span> <span class="ln"><span>in Seconds</span></span></h1>
    <p data-intro>No-Code Creator for Fresh 3D Webpages</p>
    <div class="ctas">
      <a class="btn btn--light hero-demo" data-intro href="#">Book a Demo</a>
      <a class="btn btn--solid hero-build" data-intro href="#">Build Today</a>
    </div>
  </section>

  <a class="explore" data-intro href="#">Explore now<br>&amp; step in
  </a>

  <svg class="arrow" data-intro viewBox="0 0 16 30" aria-hidden="true"><path d="M8 0v27.6M1.6 20.7 8 27.1l6.4-6.4" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
  <a class="chat" data-intro href="#">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#3e72dc"/>
      <path d="M14.75 7.44A4.9 5.7 0 1 0 14.75 14.76" fill="none" stroke="#000" stroke-width="3.1"/></svg>
    <span>Talk to us?</span>
  </a>
</main>
<script>
(function(){
  var head=document.querySelector('.masthead'),btn=head.querySelector('.burger'),menu=document.getElementById('site-menu');
  var compact=window.matchMedia('(min-width:600px) and (max-width:1099.98px) and (min-height:500px), (orientation:landscape) and (max-width:1099.98px) and (max-height:499.98px), (orientation:landscape) and (max-width:599.98px), (max-width:599.98px) and (orientation:portrait)');
  function isOpen(){return head.dataset.menu==='open';}
  function setOpen(open,returnFocus){
    head.dataset.menu=open?'open':'closed';
    btn.setAttribute('aria-expanded',open);
    btn.setAttribute('aria-label',open?'Close menu':'Open menu');
    if(open){var first=menu.querySelector('a');if(first)setTimeout(function(){first.focus({preventScroll:true})},30);}
    else if(returnFocus){btn.focus({preventScroll:true});}
  }
  btn.addEventListener('click',function(){setOpen(!isOpen());});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isOpen()){setOpen(false,true);}});
  document.addEventListener('click',function(e){if(isOpen()&&!menu.contains(e.target)&&!btn.contains(e.target)){setOpen(false);}});
  menu.addEventListener('click',function(e){if(e.target.closest('a')&&compact.matches){setOpen(false);}});
  menu.addEventListener('focusout',function(e){if(compact.matches&&isOpen()&&e.relatedTarget&&!menu.contains(e.relatedTarget)&&e.relatedTarget!==btn){setOpen(false);}});
  (compact.addEventListener?compact.addEventListener.bind(compact,'change'):compact.addListener.bind(compact))(function(){setOpen(false);});
})();
</script>
<script>
/* Entrance: one choreographed sequence on first load, then every animation is removed. */
(function(){
  var root=document.documentElement;
  if(!root.classList.contains('intro'))return;
  var OUT='cubic-bezier(.16,1,.3,1)',       /* expo-out: fast arrival, long settle */
      LINE='cubic-bezier(.19,1,.22,1)',     /* headline rise inside its mask       */
      WIPE='cubic-bezier(.76,0,.24,1)';     /* card wipe: quart in-out             */
  var anims=[],done=false;
  function shown(el){return !!(el&&el.getClientRects().length&&getComputedStyle(el).visibility!=='hidden');}
  function add(el,kf,o){if(!shown(el))return;o.fill='both';anims.push(el.animate(kf,o));}
  function q(s){return document.querySelector(s);}
  function finish(){
    if(done)return;done=true;clearTimeout(window.__ofIntroSafety);
    root.classList.remove('intro');
    anims.forEach(function(a){a.cancel();});      /* authored styles = final frame */
    anims=[];
  }
  function run(){
    /* 1 · header settles down from the top edge, read left → right */
    [].slice.call(document.querySelectorAll('.masthead [data-intro]')).filter(shown)
      .sort(function(a,b){return a.getBoundingClientRect().left-b.getBoundingClientRect().left;})
      .forEach(function(el,i){add(el,[{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],{duration:800,delay:50+i*60,easing:OUT});});
    /* 2 · headline lines rise inside their line boxes */
    [].slice.call(document.querySelectorAll('.copy h1 .ln > span')).forEach(function(el,i){
      add(el,[{transform:'translateY(105%)'},{transform:'none'}],{duration:1050,delay:180+i*90,easing:LINE});});
    /* 3 · supporting copy, then the CTA pair */
    add(q('.copy p'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:800,delay:520,easing:OUT});
    add(q('.hero-demo'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:750,delay:660,easing:OUT});
    add(q('.hero-build'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:750,delay:740,easing:OUT});
    /* 4 · card wipes open from the edge it is pinned to, arrow draws down, chat settles */
    var card=q('.explore');
    if(shown(card)){
      var top=card.getBoundingClientRect().top<innerHeight/2,r=getComputedStyle(card).borderTopLeftRadius;
      add(card,[{opacity:1,clipPath:(top?'inset(0 0 100% 0 round ':'inset(100% 0 0 0 round ')+r+')',transform:'translateY('+(top?-8:8)+'px)'},
                {opacity:1,clipPath:'inset(0 0 0 0 round '+r+')',transform:'none'}],{duration:950,delay:780,easing:WIPE});
    }
    add(q('.chat'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:700,delay:1180,easing:OUT});
    add(q('.arrow'),[{opacity:1,transform:'scaleY(0)',transformOrigin:'50% 0'},{opacity:1,transform:'none',transformOrigin:'50% 0'}],{duration:550,delay:1280,easing:OUT});
    if(!anims.length){finish();return;}
    Promise.all(anims.map(function(a){return a.finished;})).then(finish,finish);
  }
  /* any interaction with the menu ends the entrance immediately */
  var burger=q('.burger');if(burger)burger.addEventListener('click',finish,true);
  /* start once fonts and the stage image are ready (capped so nobody waits) */
  var bg=getComputedStyle(q('.bg')).backgroundImage,m=/url\(["']?(.*?)["']?\)/.exec(bg),ready=[document.fonts?document.fonts.ready:null];
  if(m){var img=new Image();img.src=m[1];ready.push(img.decode?img.decode().catch(function(){}):null);}
  Promise.race([Promise.all(ready),new Promise(function(r){setTimeout(r,800);})]).then(function(){requestAnimationFrame(run);});
})();
</script>
